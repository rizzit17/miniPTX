name: MiniPTX checks
on: [push, pull_request]
jobs:
  compiler-api:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cmake -S compiler -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cmake -S compiler -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start app and run end-to-end tests
        run: |
          python scripts/dev.py --production > /tmp/miniptx.log 2>&1 &
          APP_PID=$!
          trap 'kill -INT $APP_PID; cat /tmp/miniptx.log' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          python scripts/smoke.py
          cd frontend
          npm test
